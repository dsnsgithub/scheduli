name: Build and Submit iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup
        with:
          xcode: true

      - name: Install dependencies
        run: bun ci

      - name: Build iOS App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile build:ios

      - name: Submit iOS App
        if: github.ref == 'refs/heads/main'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile submit:ios
