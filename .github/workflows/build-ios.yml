name: Build and Submit iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Pin CocoaPods
        run: gem install cocoapods -v 1.17.0 --no-document

      - name: Install dependencies
        run: bun ci

      - name: Build iOS App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile build:ios

      - name: Submit iOS App
        if: github.ref == 'refs/heads/main'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile submit:ios
