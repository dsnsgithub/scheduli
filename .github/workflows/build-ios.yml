name: Build and Submit iOS App

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Build iOS App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile build:ios

      - name: Submit iOS App
        if: github.ref == 'refs/heads/main'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile submit:ios
