name: Build and Submit Android App

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

# Pinned tool versions for this workflow. See .github/README.md.
env:
  BUN_VERSION: 1.3.14 # keep in sync with "packageManager" in package.json
  JAVA_VERSION: 21.0.11+10

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun ci

      - name: Build Android App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile build:android

      - name: Submit Android App
        if: github.ref == 'refs/heads/main'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun run --filter @scheduli/mobile submit:android
