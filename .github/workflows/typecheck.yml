name: Typecheck

on:
  workflow_dispatch:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14 # keep in sync with "packageManager" in package.json

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run --filter @scheduli/mobile typecheck
