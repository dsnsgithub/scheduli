name: Typecheck

on:
  workflow_dispatch:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run --filter @scheduli/mobile typecheck
