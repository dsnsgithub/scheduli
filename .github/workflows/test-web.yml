name: Test Website

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: bun ci

      # The browser build is chosen by the exact @playwright/test version in
      # apps/web/package.json, so this is pinned by the lockfile.
      - name: Install Playwright Browsers
        run: bun run --filter @scheduli/web test:setup

      - name: Run Playwright tests
        run: bun run --filter @scheduli/web test

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: ./apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 1
