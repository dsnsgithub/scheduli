name: Test Website

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14 # keep in sync with "packageManager" in package.json

      - name: Install dependencies
        run: bun ci

      # The browser build is chosen by the exact @playwright/test version in
      # apps/web/package.json, so this is pinned by the lockfile.
      - name: Install Playwright Browsers
        run: bun run --filter @scheduli/web test:setup

      - name: Run Playwright tests
        run: bun run --filter @scheduli/web test

      - uses: actions/upload-artifact@v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: ./apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 1
