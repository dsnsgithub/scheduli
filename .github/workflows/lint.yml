name: Lint

on:
  workflow_dispatch:
  pull_request:

jobs:
  lint:
    # Pinned image, not `ubuntu-latest`: the `latest` alias moves to a new
    # Ubuntu release without warning. Tool versions come from
    # .github/actions/setup.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: bun ci

      - name: Run lint
        run: bun run lint
