name: Lint

on:
  workflow_dispatch:
  pull_request:

jobs:
  lint:
    # Pinned image, not `ubuntu-latest`: the `latest` alias moves to a new
    # Ubuntu release without warning, taking the whole preinstalled toolchain
    # with it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14 # keep in sync with "packageManager" in package.json

      - name: Install dependencies
        run: bun ci

      - name: Run lint
        run: bun run lint
