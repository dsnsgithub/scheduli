name: Test iOS App

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21.0.11

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Pin CocoaPods
        run: gem install cocoapods -v 1.17.0 --no-document

      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.8.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun ci

      - name: Build iOS Simulator App
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: dsnss-projects
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bunx turbo run build:ios:simulator

      - uses: futureware-tech/simulator-action@v4
        with:
          model: "iPhone 17 Pro"
          os: "iOS"
          os_version: "26.5"
          wait_for_boot: true

      - name: Install iOS App
        run: bun run --filter @scheduli/mobile install:ios:simulator

      - name: Run iOS Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
        run: bun run --filter @scheduli/mobile test

      - name: Create Debug Information
        if: failure()
        run: |
          mkdir -p ./debug-info
          cp -r ~/Library/Logs/DiagnosticReports/ ./debug-info/diagnostic-reports
          cp -r ~/Library/Logs/CoreSimulator ./debug-info/simulator-logs
          cp -r apps/mobile/.maestro/recordings ./debug-info/recordings
          cp -r ~/.maestro/tests ./debug-info/maestro-logs

      - name: Upload Debug Information
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: debug-info
          path: ./debug-info/
          if-no-files-found: ignore
          retention-days: 1
