name: Test iOS App

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    # Pinned image, not `macos-latest`: that alias follows each new macOS
    # release, which swaps the default Xcode, the simulator runtimes and the
    # preinstalled CocoaPods underneath a build that never changed.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup
        with:
          java: true # Maestro runs on the JVM
          xcode: true
          maestro: true

      - name: Install dependencies
        run: bun ci

      - name: Build iOS Simulator App
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: dsnss-projects
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bunx turbo run build:ios:simulator

      # `os` is pinned as well as `model`: without it the action boots whatever
      # the newest installed runtime happens to be.
      - uses: futureware-tech/simulator-action@dab10d813144ef59b48d401cd95da151222ef8cd # v4
        with:
          model: "iPhone 17 Pro"
          os: "iOS"
          os_version: "26.5"
          wait_for_boot: true

      - name: Install iOS App
        run: bun run --filter @scheduli/mobile install:ios:simulator

      - name: Run iOS Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
        run: bun run --filter @scheduli/mobile test

      - name: Create Debug Information
        if: failure()
        run: |
          mkdir -p ./debug-info
          cp -r ~/Library/Logs/DiagnosticReports/ ./debug-info/diagnostic-reports
          cp -r ~/Library/Logs/CoreSimulator ./debug-info/simulator-logs
          cp -r apps/mobile/.maestro/recordings ./debug-info/recordings
          cp -r ~/.maestro/tests ./debug-info/maestro-logs

      - name: Upload Debug Information
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: debug-info
          path: ./debug-info/
          if-no-files-found: ignore
          retention-days: 1
