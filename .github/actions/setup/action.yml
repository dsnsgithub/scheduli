name: Setup
description: Installs the pinned toolchain that every Scheduli CI job builds on.

# ---------------------------------------------------------------------------
# This file is the single source of truth for CI tool versions.
#
# Everything here is pinned to an exact version on purpose: a green CI run
# today should still be green in a year without touching the repo. Nothing may
# resolve to "latest", a floating tag, or "whatever the runner image ships".
#
# The values below were captured from the GitHub-hosted `macos-26` and
# `ubuntu-24.04` images (image version 20260728.0273.1), so pinning them is a
# no-op today and a guarantee later.
#
# To upgrade a tool, change it here, in this file only, and let CI prove it.
# ---------------------------------------------------------------------------

inputs:
  java:
    description: Install the pinned Temurin JDK (Android builds, and Maestro's runtime).
    required: false
    default: "false"
  xcode:
    description: Select the pinned Xcode and force the pinned CocoaPods (macOS only).
    required: false
    default: "false"
  maestro:
    description: Install the pinned Maestro CLI.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14 # keep in sync with "packageManager" in package.json

    # Node is pinned per-OS to the version each runner image ships today, so
    # this freezes current behaviour instead of changing it. Both are already
    # in the runner tool cache, so setup-node is a fast no-op.
    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ runner.os == 'macOS' && '24.18.0' || '22.23.2' }}

    - name: Install Java
      if: inputs.java == 'true'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: 21.0.11+10

    - name: Select Xcode
      if: inputs.xcode == 'true'
      shell: bash
      run: |
        set -euo pipefail
        xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
        if [ ! -d "$xcode_app" ]; then
          echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner image."
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          echo "Pick one of the above and update XCODE_VERSION in .github/actions/setup/action.yml."
          exit 1
        fi
        sudo xcode-select --switch "$xcode_app"
        xcodebuild -version
      env:
        XCODE_VERSION: "26.6"

    # `pod` is resolved from PATH by the EAS build, so pinning the gem is not
    # enough: a newer CocoaPods preinstalled on a future runner image would
    # still win. A shim that always calls the exact gem version removes that.
    - name: Pin CocoaPods
      if: inputs.xcode == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! gem list -i -v "$COCOAPODS_VERSION" cocoapods > /dev/null 2>&1; then
          gem install cocoapods -v "$COCOAPODS_VERSION" --no-document \
            || sudo gem install cocoapods -v "$COCOAPODS_VERSION" --no-document
        fi
        real_pod="$(command -v pod)"
        shim_dir="$RUNNER_TEMP/pinned-bin"
        mkdir -p "$shim_dir"
        printf '#!/usr/bin/env bash\nexec "%s" _%s_ "$@"\n' "$real_pod" "$COCOAPODS_VERSION" > "$shim_dir/pod"
        chmod +x "$shim_dir/pod"
        echo "$shim_dir" >> "$GITHUB_PATH"
        "$shim_dir/pod" --version
      env:
        COCOAPODS_VERSION: "1.17.0"

    # Deliberately not `curl https://get.maestro.mobile.dev | bash`: that
    # installs whatever the newest release happens to be, and pipes a script
    # that can change under us. This fetches one immutable release asset.
    - name: Install Maestro
      if: inputs.maestro == 'true'
      shell: bash
      run: |
        set -euo pipefail
        download_dir="$RUNNER_TEMP/maestro-download"
        mkdir -p "$download_dir"
        curl -fsSL --retry 3 --retry-all-errors \
          -o "$download_dir/maestro.zip" \
          "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
        unzip -q "$download_dir/maestro.zip" -d "$download_dir"
        mkdir -p "$HOME/.maestro"
        cp -rf "$download_dir/maestro/." "$HOME/.maestro/"
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        "$HOME/.maestro/bin/maestro" --version
      env:
        MAESTRO_VERSION: "2.8.0"
